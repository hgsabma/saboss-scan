{% extends "public_base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Log in</h1>
  <p class="muted mt">Welcome back to Saboss Scan.</p>
  {% if flash %}<div class="alert alert-{{ flash.level }}" role="status">{{ flash.message }}</div>{% endif %}
  {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" novalidate>
    <input type="hidden" name="{{ CSRF_FIELD }}" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required value="{{ email or '' }}">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
  <p class="small mt"><a href="/forgot-password">Forgot your password?</a> · <a href="/register">Create an account</a></p>
</div>
{% endblock %}

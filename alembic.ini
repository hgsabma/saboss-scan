# Alembic database migrations. Run: python -m saboss_platform migrate
[alembic]
script_location = migrations
prepend_sys_path = .
# The real URL comes from SABOSS_DATABASE_URL (see migrations/env.py).
sqlalchemy.url = sqlite:///./data/saboss.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s

name: Tests

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, security and migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Formatting (ruff format)
        run: ruff format --check .
      - name: Static security analysis (bandit)
        # B105 is skipped: it flags the finding status "pass" as a password.
        # ruff's S105 rule still checks for hardcoded passwords.
        run: bandit -q -r saboss_scan saboss_platform main.py -s B105
      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt -r requirements-postgres.txt --progress-spinner off
      - name: Migrations match the models
        env:
          SABOSS_DATABASE_URL: sqlite:///./ci-check.db
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t saboss-scan:ci .
      - name: Container starts and is healthy
        run: |
          docker run -d --name saboss -p 8000:8000 \
            -e SABOSS_DATABASE_URL=sqlite:////app/data/saboss.db \
            -e SABOSS_ALLOWED_HOSTS=127.0.0.1,localhost \
            -e SABOSS_COOKIE_SECURE=false \
            saboss-scan:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 2
          done
          docker logs saboss
          exit 1
